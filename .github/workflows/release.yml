name: Build and Release

on:
  push:
    branches: [master]      # change to master if that's your default branch
  pull_request:
  workflow_dispatch:      # lets you run it manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04     # older glibc = runs on more distros
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DUSE_SYSTEM_GLFW=OFF
          -DSTATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp build/app dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar czf app-${{ matrix.name }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp build/Release/app.exe dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          7z a app-${{ matrix.name }}.zip ./dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: |
            app-${{ matrix.name }}.tar.gz
            app-${{ matrix.name }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: github.event_name == 'push'    # not for pull requests
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # needed to create releases

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: app-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
